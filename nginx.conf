# Reference nginx config, matching how the site is actually served.
#
# Everything goes to Next.js on :3000, including /api. Next's rewrite
# (frontend/next.config.js) forwards /api/* to the backend on :8080. An earlier
# version of this file sent /api straight to :8080 instead, which did not match
# the deployment and would have split streaming and CORS handling across two
# layers.
#
# Consequence worth knowing: the browser only ever talks to this host, so its
# requests are same-origin -- but the proxy still forwards the original `Origin`
# header to Spring, which therefore applies its CORS rules to them. Every public
# hostname the site answers on must appear in CORS_ALLOWED_ORIGIN_PATTERNS, or
# browser writes fail with a bare 403 "Invalid CORS request" while curl (which
# sends no Origin header) succeeds against the very same endpoint.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat replies stream as NDJSON; buffering them defeats the point.
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Health check goes straight to the backend so it does not depend on the frontend.
    location /health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
    }
}
